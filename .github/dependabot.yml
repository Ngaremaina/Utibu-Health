# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # frontend (Expo / TypeScript)
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      # Expo SDK packages must move together; upgrade the SDK itself with
      # `npx expo install expo@^<next> --fix` rather than via Dependabot.
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "jest-expo"
          - "eslint-config-expo"
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "@types/react"
          - "react-native"
          - "react-native-*"
          - "@react-native-async-storage/*"
          - "@expo/*"
      dev-tooling:
        dependency-type: "development"
        exclude-patterns:
          - "jest-expo"
          - "eslint-config-expo"
          - "react-test-renderer"
          - "@types/react"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "pip" # backend (Flask)
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
