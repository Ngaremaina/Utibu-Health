[project]
name = "utibu-health-api"
version = "1.0.0"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used by Docker/CI). Vercel installs from here.
dependencies = [
    "alembic==1.20.1",
    "bcrypt==5.0.0",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-JWT-Extended==4.7.4",
    "Flask-Limiter==4.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "gunicorn==26.2.0",
    "marshmallow==4.3.1",
    "psycopg[binary]==3.3.6",
    "PyJWT==2.15.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "SQLAlchemy==2.1.6",
    "Werkzeug==3.1.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
# TestingConfig/DevelopmentConfig carry obviously-fake placeholder secrets.
"app/config.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
